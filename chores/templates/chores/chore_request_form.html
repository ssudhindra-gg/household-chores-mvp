{% extends "chores/base.html" %}

{% block title %}Request a chore | Household Chores{% endblock %}

{% block content %}
  <main class="page-shell">
    <section class="page-heading"><div><p class="eyebrow">Make your voice count</p><h1>Request a chore</h1><p class="lede">Have an idea that would help at home? Put it on the family board.</p></div></section>
    <form class="panel form-panel" method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{% url 'chores:family_board' %}">
      {{ form.as_p }}
      <button type="submit">Submit request</button>
    </form>
  </main>
{% endblock %}
