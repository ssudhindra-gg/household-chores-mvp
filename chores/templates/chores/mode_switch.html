<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Household Chores Mode</title></head>
  <body>
    <main>
      <h1>Household Chores</h1>
      <p data-current-mode="{{ current_mode }}">
        Current mode: <strong>{{ current_mode|title }} Mode</strong>
      </p>
      <form method="post" action="{% url 'set_session_mode' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{% url 'mode_switch' %}">
        <button type="submit" name="mode" value="parent">Parent Mode</button>
        <button type="submit" name="mode" value="kid">Kid Mode</button>
      </form>
    </main>
  </body>
</html>
