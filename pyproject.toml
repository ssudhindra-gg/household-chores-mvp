[project]
name = "household-chores"
version = "0.1.0"
description = "Shared household chores MVP"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "household_chores.settings"
testpaths = ["tests", "chores"]
